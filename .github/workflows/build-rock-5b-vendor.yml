name: Build rock-5b vendor

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'config/boards/rock-5b.*'
      - 'config/kernel/**'
      - 'config/sources/**'
      - 'patch/**'
      - 'lib/**'
      - 'extensions/**'
      - 'packages/**'
      - 'compile.sh'
      - '.github/workflows/build-rock-5b-vendor.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'config/boards/rock-5b.*'
      - 'config/kernel/**'
      - 'config/sources/**'
      - 'patch/**'
      - 'lib/**'
      - 'extensions/**'
      - 'packages/**'
      - 'compile.sh'
      - '.github/workflows/build-rock-5b-vendor.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        uses: descriptinc/free-disk-space@1b4b157593c6801212a2ed488c205e0a810b4592
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up QEMU binfmt
        uses: docker/setup-qemu-action@v3

      - name: Pull build container
        run: docker pull ghcr.io/armbian/docker-armbian-build:armbian-ubuntu-noble-latest

      - name: Build rock-5b vendor
        run: |
          docker run --rm \
            --privileged \
            --security-opt apparmor:unconfined \
            --device-cgroup-rule='b 7:* rmw' \
            --device-cgroup-rule='b 259:* rmw' \
            -v /dev:/tmp/dev:ro \
            -v "${{ github.workspace }}":/armbian \
            ghcr.io/armbian/docker-armbian-build:armbian-ubuntu-noble-latest \
            ./compile.sh build BOARD=rock-5b BRANCH=vendor RELEASE=trixie BUILD_DESKTOP=no BUILD_MINIMAL=no KERNEL_CONFIGURE=no SHARE_LOG=yes

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rock-5b-vendor-output
          path: output/
          retention-days: 7
